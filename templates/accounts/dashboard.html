
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop | Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at 20% 20%, #123c70, transparent 40%),
                radial-gradient(circle at 80% 80%, #073b70, transparent 40%),
                linear-gradient(135deg, #020817, #061a35, #020817);
            color: white;
        }

        /* Lightning background */
        .lightning {
            position: absolute;
            width: 5px;
            height: 350px;
            background: #48caff;
            opacity: 0;
            filter: blur(2px);
            box-shadow:
                0 0 10px #48caff,
                0 0 30px #168cff,
                0 0 70px #008cff;
            clip-path: polygon(
                50% 0, 100% 35%, 60% 35%,
                100% 65%, 35% 100%, 45% 60%,
                0 60%, 45% 35%
            );
            animation: thunder 4s infinite;
        }

        .lightning.one {
            top: -50px;
            left: 20%;
            transform: rotate(15deg);
        }

        .lightning.two {
            top: -80px;
            right: 20%;
            transform: rotate(-15deg);
            animation-delay: 2s;
        }

        @keyframes thunder {
            0%, 85%, 100% {
                opacity: 0;
            }
            87% {
                opacity: 0.9;
            }
            89% {
                opacity: 0.1;
            }
            91% {
                opacity: 1;
            }
            93% {
                opacity: 0;
            }
        }

        /* Main card */
        .dashboard {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 650px;
            padding: 65px 35px;
            text-align: center;
            border: 1px solid rgba(76, 190, 255, 0.4);
            border-radius: 25px;
            background: rgba(5, 24, 49, 0.75);
            backdrop-filter: blur(15px);
            box-shadow:
                0 0 30px rgba(0, 140, 255, 0.2),
                inset 0 0 25px rgba(0, 140, 255, 0.08);
        }

        .bolt {
            font-size: 65px;
            color: #56d7ff;
            text-shadow:
                0 0 10px #56d7ff,
                0 0 30px #008cff,
                0 0 60px #008cff;
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px #56d7ff;
                transform: scale(1);
            }
            to {
                text-shadow: 0 0 30px #56d7ff,
                             0 0 60px #008cff;
                transform: scale(1.08);
            }
        }

        h1 {
            margin-top: 20px;
            font-size: 38px;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(0, 153, 255, 0.8);
        }

        .welcome {
            margin-top: 18px;
            font-size: 17px;
            line-height: 1.7;
            color: #b9dcff;
        }

        .message {
            margin: 30px auto 0;
            padding: 15px 20px;
            max-width: 420px;
            border: 1px solid rgba(72, 202, 255, 0.5);
            border-radius: 12px;
            background: rgba(0, 140, 255, 0.12);
            color: #8fe5ff;
            box-shadow: 0 0 20px rgba(0, 140, 255, 0.15);
        }

        .status {
            margin-top: 28px;
            font-size: 13px;
            color: #75d6ff;
            letter-spacing: 2px;
        }

        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin-right: 8px;
            border-radius: 50%;
            background: #35ffad;
            box-shadow: 0 0 10px #35ffad;
        }

        @media (max-width: 500px) {
            .dashboard {
                padding: 45px 20px;
            }

            h1 {
                font-size: 29px;
            }

            .welcome {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="lightning one"></div>
    <div class="lightning two"></div>

    <div class="dashboard">

        <div class="bolt">ϟ</div>

        <h1>Welcome to Loop!</h1>

        <p class="welcome">
            You have successfully logged in.
            <br>
            Your journey starts here.
        </p>

        <div class="message">
            ⚡ Stay Focused. Stay Consistent. Keep Moving Forward.
        </div>

        <div class="status">
            <span class="dot"></span>
            YOU ARE SUCCESSFULLY CONNECTED
        </div>

    </div>

</body>
</html>
